<?!= include('Charts'); ?>
<script>
  var PALETTE = ['#2563eb', '#f97316', '#10b981', '#8b5cf6', '#ec4899', '#facc15', '#64748b'];

  google.script.run
    .withSuccessHandler(onData)
    .withFailureHandler(onError)
    .fetchMembersData();

  function onData(result) {
    var statusEl = document.getElementById('status');
    if (!result.ok) {
      onError(result.error);
      return;
    }
    statusEl.style.display = 'none';
    document.getElementById('content').style.display = 'block';

    document.getElementById('totalMembers').textContent = formatNumber(result.totalMembers);
    var badge = document.getElementById('lastUpdatedBadge');
    badge.textContent = result.lastSignupAt
      ? '시트 내 최신 가입일 기준: ' + result.lastSignupAt
      : '가입일시 데이터 없음';

    if (result.signupTrend && result.signupTrend.length) {
      drawAreaLineChart(
        'signupTrendChart',
        result.signupTrend.map(function (d) { return d.date.slice(5); }),
        result.signupTrend.map(function (d) { return d.count; }),
        '#2563eb',
        'rgba(37,99,235,0.08)'
      );
    }

    if (result.genders && result.genders.length) {
      drawDonutChart(
        'genderChart',
        result.genders.map(function (g) { return g.label; }),
        result.genders.map(function (g) { return g.count; }),
        PALETTE
      );
    }

    if (result.ageGroups && result.ageGroups.length) {
      drawHBarChart(
        'ageChart',
        result.ageGroups.map(function (a) { return a.label; }),
        result.ageGroups.map(function (a) { return a.count; }),
        '#10b981'
      );
    }

    if (result.signupChannels && result.signupChannels.length) {
      drawHBarChart(
        'channelChart',
        result.signupChannels.map(function (c) { return c.label; }),
        result.signupChannels.map(function (c) { return c.count; }),
        '#8b5cf6'
      );
    }
  }

  function onError(err) {
    document.getElementById('status').innerHTML =
      '⚠️ 데이터를 불러오지 못했습니다.<br><span style="font-size:12px;">' + err + '</span>';
  }
</script>
