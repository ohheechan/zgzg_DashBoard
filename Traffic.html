<?!= include('Charts'); ?>
<script>
  var PALETTE = ['#2563eb', '#f97316', '#10b981', '#8b5cf6', '#ec4899', '#facc15', '#64748b'];

  google.script.run
    .withSuccessHandler(onData)
    .withFailureHandler(onError)
    .fetchTrafficData();

  function onData(result) {
    var statusEl = document.getElementById('status');
    if (!result.ok) {
      onError(result.error);
      return;
    }
    statusEl.style.display = 'none';
    document.getElementById('content').style.display = 'block';

    if (result.channels && result.channels.length) {
      drawHBarChart(
        'channelChart',
        result.channels.map(function (c) { return c.channel; }),
        result.channels.map(function (c) { return c.sessions; }),
        '#2563eb'
      );
    }
    if (result.devices && result.devices.length) {
      drawDonutChart(
        'deviceChart',
        result.devices.map(function (d) { return d.device; }),
        result.devices.map(function (d) { return d.sessions; }),
        PALETTE
      );
    }

    var tbody = document.getElementById('topPagesBody');
    (result.topPages || []).forEach(function (p) {
      var tr = document.createElement('tr');
      tr.style.borderBottom = '1px solid #f3f4f6';
      var tdPath = document.createElement('td');
      tdPath.style.padding = '8px 4px';
      tdPath.style.wordBreak = 'break-all';
      tdPath.textContent = p.path;
      var tdViews = document.createElement('td');
      tdViews.style.padding = '8px 4px';
      tdViews.style.textAlign = 'right';
      tdViews.textContent = formatNumber(p.views);
      tr.appendChild(tdPath);
      tr.appendChild(tdViews);
      tbody.appendChild(tr);
    });
  }

  function onError(err) {
    document.getElementById('status').innerHTML =
      '⚠️ 데이터를 불러오지 못했습니다.<br><span style="font-size:12px;">' + err + '</span>';
  }
</script>
