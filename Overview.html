<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>

<h1 style="margin-top:0;">개요</h1>
<p style="color:#6b7280; margin-top:-8px;">최근 14일간 방문자 수 / 신규 가입자 수 추이</p>

<div id="status" style="color:#6b7280; padding: 40px 0; text-align:center;">데이터를 불러오는 중...</div>
<div style="background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:20px; display:none;" id="chartWrap">
  <canvas id="overviewChart" height="90"></canvas>
</div>
<div id="fallbackTable" style="display:none; margin-top:16px;"></div>

<script>
  google.script.run
    .withSuccessHandler(onData)
    .withFailureHandler(onError)
    .fetchOverviewData();

  function onData(result) {
    var statusEl = document.getElementById('status');
    if (!result.ok) {
      onError(result.error);
      return;
    }

    if (!result.daily || result.daily.length === 0) {
      statusEl.innerHTML = '최근 14일간 데이터가 없습니다.';
      return;
    }

    var labels = result.daily.map(function (d) { return d.date.slice(5); }); // MM-DD
    var activeUsers = result.daily.map(function (d) { return d.activeUsers; });
    var newUsers = result.daily.map(function (d) { return d.newUsers; });

    var chartOk = false;
    try {
      if (typeof Chart === 'undefined') {
        throw new Error('Chart.js 라이브러리를 불러오지 못했습니다 (CDN 로드 실패).');
      }
      statusEl.style.display = 'none';
      document.getElementById('chartWrap').style.display = 'block';

      new Chart(document.getElementById('overviewChart'), {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: '방문자 수 (활성 사용자)',
              data: activeUsers,
              borderColor: '#2563eb',
              backgroundColor: 'rgba(37,99,235,0.1)',
              tension: 0.3,
              fill: true,
            },
            {
              label: '신규 가입자 수',
              data: newUsers,
              borderColor: '#f97316',
              backgroundColor: 'rgba(249,115,22,0.1)',
              tension: 0.3,
              fill: true,
            },
          ],
        },
        options: {
          responsive: true,
          plugins: { legend: { position: 'bottom' } },
          scales: { y: { beginAtZero: true } },
        },
      });
      chartOk = true;
    } catch (chartErr) {
      console.error('Chart render failed:', chartErr);
    }

    // 차트 렌더링에 실패해도 숫자는 항상 볼 수 있도록 표 형태로 같이 보여줌
    if (!chartOk) {
      statusEl.style.display = 'none';
      document.getElementById('chartWrap').style.display = 'none';
    }
    renderFallbackTable(result.daily, chartOk);
  }

  function renderFallbackTable(daily, chartOk) {
    var el = document.getElementById('fallbackTable');
    var rows = daily
      .map(function (d) {
        return '<tr><td style="padding:4px 12px;">' + d.date + '</td>' +
          '<td style="padding:4px 12px; text-align:right;">' + d.activeUsers + '</td>' +
          '<td style="padding:4px 12px; text-align:right;">' + d.newUsers + '</td></tr>';
      })
      .join('');
    var note = chartOk
      ? ''
      : '<p style="color:#b45309; background:#fffbeb; border:1px solid #fde68a; border-radius:8px; padding:10px 14px; font-size:13px;">⚠️ 그래프 렌더링에 실패해서 표로 대신 보여드려요. (원인: Chart.js 로드 또는 렌더링 오류)</p>';
    el.innerHTML =
      note +
      '<table style="border-collapse:collapse; width:100%; background:#fff; border:1px solid #e5e7eb; border-radius:12px; overflow:hidden;">' +
      '<thead><tr style="background:#f3f4f6; text-align:left;">' +
      '<th style="padding:6px 12px;">날짜</th><th style="padding:6px 12px; text-align:right;">방문자 수</th><th style="padding:6px 12px; text-align:right;">신규 가입자 수</th>' +
      '</tr></thead><tbody>' +
      rows +
      '</tbody></table>';
    el.style.display = 'block';
  }

  function onError(err) {
    document.getElementById('status').innerHTML =
      '⚠️ 데이터를 불러오지 못했습니다.<br><span style="font-size:12px;">' + err + '</span>';
  }
</script>
